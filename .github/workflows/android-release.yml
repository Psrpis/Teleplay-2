name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
      create_release:
        description: 'Publish to GitHub Releases'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Generate checksum
        working-directory: android
        run: sha256sum app/build/outputs/apk/debug/app-universal-debug.apk > app/build/outputs/apk/debug/app-universal-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: teleplay-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-universal-debug.apk
            android/app/build/outputs/apk/debug/app-universal-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag_name }}"
            if [ -z "$tag" ]; then
              tag="v2.0.0"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          apk="android/app/build/outputs/apk/debug/app-universal-debug.apk"
          checksum="android/app/build/outputs/apk/debug/app-universal-debug.apk.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
          else
            if [ -f "RELEASE_NOTES.md" ]; then
              gh release create "$tag" "$apk" "$checksum" \
                --repo "$GITHUB_REPOSITORY" \
                --title "TelePlay Android $tag" \
                --notes-file RELEASE_NOTES.md
            else
              gh release create "$tag" "$apk" "$checksum" \
                --repo "$GITHUB_REPOSITORY" \
                --title "TelePlay Android $tag" \
                --generate-notes
            fi
          fi
